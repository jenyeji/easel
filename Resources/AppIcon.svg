<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Easel app icon. Edit this file, then run "python3 Resources/make-icon.py" (needs: pip install cairosvg pillow) to update AppIcon-1024.png. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3D45"/>
      <stop offset="1" stop-color="#1B1C21"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34457F"/>
      <stop offset="0.45" stop-color="#8A7796"/>
      <stop offset="0.8" stop-color="#F0A673"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD98F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD98F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="canvas"><rect x="182" y="282" width="660" height="460"/></clipPath>
  </defs>

  <!-- Dark background tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>

  <!-- Landscape painting -->
    <g clip-path="url(#canvas)">
    <rect x="182" y="282" width="660" height="460" fill="url(#sky)"/>
    <circle cx="640" cy="548" r="120" fill="url(#sunGlow)"/>
    <circle cx="640" cy="548" r="60" fill="#FFD68C"/>
    <path d="M182,578 C300,548 400,612 540,584 C660,560 760,540 842,556 L842,742 L182,742 Z" fill="#63796F"/>
    <path d="M182,636 C320,606 470,618 600,628 C710,636 780,652 842,662 L842,742 L182,742 Z" fill="#3E5F51"/>
    <path d="M182,690 C330,676 480,682 620,698 C720,710 790,718 842,724 L842,742 L182,742 Z" fill="#22392F"/>
  </g>
  <rect x="182" y="282" width="660" height="460" fill="none" stroke="#FFFFFF" stroke-width="6"/>

  <!-- Corner handles -->
  <g fill="#0A84FF" stroke="#FFFFFF" stroke-width="8">
    <circle cx="182" cy="282" r="32"/>
    <circle cx="842" cy="282" r="32"/>
    <circle cx="842" cy="742" r="32"/>
    <circle cx="182" cy="742" r="32"/>
  </g>
</svg>
